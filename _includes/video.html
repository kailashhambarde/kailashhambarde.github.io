<figure class="post-media">
  <video controls preload="metadata" {% if include.poster %}poster="{{ include.poster | relative_url }}"{% endif %}>
    <source src="{{ include.src | relative_url }}" {% if include.type %}type="{{ include.type }}"{% endif %}>
    Your browser does not support the video tag.
  </video>
  {% if include.caption %}
  <figcaption>{{ include.caption }}</figcaption>
  {% endif %}
</figure>
